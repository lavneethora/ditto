<!--
  Captured 2026-08-30 from a live public Ashby posting
  (jobs.ashbyhq.com). No personal data: nothing was filled before capture.

  Structural features this fixture pins down:

  1. Every field wrapper carries `data-field-path`. Core fields get stable
     names (_systemfield_name, _systemfield_email, _systemfield_resume,
     _systemfield_location); company-specific ones get a UUID. That path is an
     exact identifier, unlike a label, so the adapter reads it first.
  2. `<label for>` works for plain fields, so core label resolution handles
     them without help.
  3. A radio group is a `<fieldset>` with NO `<legend>`. The question is a
     `<label class="ashby-application-form-question-title">`, and each option's
     label is a SIBLING of its input, not an ancestor. Removing only ancestor
     rows leaves every option's text in the question.
  4. The "how did you hear" checkboxes share a fieldset but each has a
     DIFFERENT name, the option's own text. Grouping by name alone reports one
     row per option.
  5. Location is react-select behind a plain-looking input: no role, no
     aria-haspopup on the wrapper.
-->

    <label class="_heading_f7cvd_52 _required_f7cvd_91 ashby-application-form-question-title" for="_systemfield_name">Full Name</label>
    <div><input placeholder="Type here..." name="_systemfield_name" required="" id="_systemfield_name" type="text"></div>
