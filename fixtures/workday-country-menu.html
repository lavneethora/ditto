<!--
  The Country dropdown of fixtures/workday-my-information.html, open. Captured
  2026-08-30 from the same live tenant, trimmed from roughly 250 options to the
  first twelve. Nothing else is edited.

  Structural features this fixture pins down:

  1. The menu is portalled OUT of the form, to a body-level div positioned by
     popper (`data-popper-placement`, `data-behavior-click-outside-close`). The
     nesting below reproduces that: the field is inside `applyFlowPage` and the
     menu is a sibling of it, which is what the page really looks like.

     It cuts both ways. An option lookup scoped to the adapter's root will
     never find the menu, so the dropdown driver searches the whole document.
     And the scan, which IS scoped to the root, never mistakes an open menu for
     a field, which matters because its option text would otherwise be read as
     one field labelled with all 250 country names.
  2. It is a plain `<ul role="listbox">` of `<li role="option">`. There is no
     search box: every option is in the DOM at once, so the value is chosen by
     reading the list, never by typing.
  3. Each option's `data-value` is the GUID Workday submits; the visible name
     is in a nested `<div>`. The two must not be confused, which is why the
     matcher scores labels and the fill writes through the option element.
  4. The first row is a real option reading "Select One" with `data-value=""`
     and `aria-disabled="true"`. It is the state the field is already in when
     empty, so selecting it is indistinguishable from doing nothing.
  5. The trigger is a TOGGLE. `aria-expanded` flips on the button, and pressing
     it again closes the menu. A driver that tries several handles in turn
     closes what it just opened and then reports that it could not open it.
-->
