<!--
  Captured 2026-08-30 from a live public Greenhouse board
  (job-boards.greenhouse.io, the newer React generation).

  No personal data: the form was never filled before capture. The only value
  present is "United States" in the phone country field, from probing how the
  react-select widget responds to a programmatic write.

  Structural features this fixture exists to pin down, all of which broke or
  would have broken an assumption:

  1. `name` is empty on every control. Only `id` is set, so any rule keyed on
     `name` finds nothing.
  2. Labels carry the required marker as a nested `<span aria-hidden>*</span>`,
     so the raw label text is "First Name*".
  3. `autocomplete` is set correctly (given-name, family-name, email). That is
     a standardized, high-confidence signal and is worth matching on.
  4. "Country" here is inside `<fieldset class="phone-input">` with
     `<legend>Phone</legend>`. It is the phone country, NOT the address
     country. Matching the bare label would put a mailing country into a
     dialling-code field.
  5. Both dropdowns are react-select, not `<select>`. This is the real source
     of the "could not open the dropdown" failure.
  6. react-select renders a hidden `<input required aria-hidden="true">` proxy.
     It must not be scanned as a field.
  7. The resume `<input type=file>` is `visually-hidden` and its own label is
     just "Attach". The useful label, "Resume/CV", is on an enclosing
     `role="group"` via aria-labelledby.
  8. The phone country selector is intl-tel-input, a button with
     `aria-haspopup="dialog"`, which is a different widget again.
-->
