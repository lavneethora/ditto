<!--
  Captured 2026-08-30 from step 2 (My Information) of a live Workday tenant,
  on an empty form. The only edit is the account email in the read-only span,
  replaced with you@example.com.

  A second tenant, and the differences from fixtures/workday-signin.html are
  the point:

  1. This wizard has SIX steps, not seven. The count is per tenant, so nothing
     may key off "step 4 of 7".
  2. `progressBarActiveStep` here holds ONLY the aria-live "current step 1 of
     6" label. The step NAME is not in the progress bar at all. It is the
     `<h3>` heading, which both captures do have, so that is what the adapter
     reads.

  Structural features this fixture pins down:

  3. Field identity is `data-automation-id="formField-<name>"` on the wrapper,
     with the control's own id repeating the name. Compound fields nest with a
     double dash: `formField-legalName--firstName`.
  4. Country, State and Phone Device Type are NOT selects. Each is a
     `<button aria-haspopup="listbox">` whose text is the display value, next
     to a bare `<input type="text">` holding a GUID. The GUID is what Workday
     submits. Typing "Texas" into that input writes a string where a key is
     expected, so the input has to be refused and the button driven instead.
     Empty state is the text "Select One" with value="".
  5. "How Did You Hear About Us?" and "Country Phone Code" are Workday's
     multiselect: a search `<input placeholder="Search">` plus a `<ul
     role="listbox">` of already-chosen pills. Typed text is a query, never a
     value. `data-automation-id="promptAriaInstruction"` states the current
     selection in words ("0 items selected", "1 item selected, ...") which is
     the cleanest read-back available.
  6. The email is a read-only `<span id="emailAddress">`, not an input. It
     comes from the account. There is nothing to fill and nothing to report.
  7. `data-automation-id="phone-sms-opt-in"` is a marketing consent, unlabelled
     except by a Terms and Conditions link. Ditto does not tick consents on
     anyone's behalf, the same rule as Lever's `consent[...]` boxes.
  8. `pageFooterNextButton` reads "Save and Continue". It advances the wizard,
     so Ditto surfaces it and the user clicks it.
-->
