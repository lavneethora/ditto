<!--
  One Work Experience panel, captured 2026-08-30 from a live Workday tenant
  after pressing Add. Empty: nothing was filled before capture.

  This markup does not exist until Add is pressed, which is why it needed a
  separate capture from the rest of the step.

  Structural features this fixture pins down:

  1. `From` and `To` are NOT date inputs. Each is a `role="group"` holding two
     `<input role="spinbutton">` with no type at all, labelled by `aria-label`
     ("Month", "Year"), behind `MM` and `YYYY` display divs. A scanner that
     takes them at face value reports two text fields per date, so a job with
     a start and an end becomes four rows called Month and Year that no
     profile has an answer for, and the real question is never asked.
  2. The section labels ("From", "To") live in a `<legend>` above the group,
     not on the inputs.
  3. `data-fkit-id="workExperience-7--jobTitle"` carries an arbitrary instance
     number. This is Work Experience 1; the ordinal is in the `<h5>`.
  4. The panel has its own Delete button, which Ditto must never press.
  5. The automation ids are shared with the education block: both use
     `formField-startDate` and `formField-endDate`, so one mapping serves both
     and applySection rewrites the key by which panel the field sits in.
-->
