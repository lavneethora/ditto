<!--
  The Websites section of Workday's My Experience step, captured 2026-08-30
  from a live tenant after pressing Add. Empty: nothing was filled before
  capture.

  Structural features this fixture pins down:

  1. A panel is a single required `formField-url` text box, headed "Websites 1".
     The box says nothing about WHICH link it wants, so nothing in the markup
     can distinguish a LinkedIn profile from a portfolio. The profile's three
     link fields are presented to it as one ordered list and paired with panels
     by position, the same way Education 1 pairs with the first degree.
  2. Like every other repeatable section it starts with no panels at all, so
     none of this exists until Add is pressed.
  3. The panel carries its own Delete button, which Ditto must never press.
-->
