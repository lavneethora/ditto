<!--
  Captured 2026-08-30 from a live public Workday tenant
  (nvidia.wd5.myworkdayjobs.com), at .../apply/applyManually. No personal data:
  nothing was filled before capture, and no account was created or signed into.

  This is step 1 of 7. It is here because it is the step Ditto must refuse, and
  because it is the only step reachable without an account. Steps 2 through 7
  (My Information, My Experience, Application Questions, Voluntary Disclosures,
  Self Identify, Review) sit behind the sign-in below, so their field markup is
  not captured yet and no rule in the adapter guesses at it.

  Structural features this fixture pins down:

  1. The wizard is seven steps, and the step names are readable from the
     `progressBar` before you have signed in. `progressBarActiveStep` carries
     TWO labels: an aria-live one reading "current step 1 of 7" and the real
     name. Reading textContent off the <li> concatenates both.
  2. Every field is a `data-automation-id="formField-<name>"` wrapper holding a
     `<label for>` and a control whose own `data-automation-id` is `<name>`.
     That suffix is Workday's stable field identifier, the way `data-field-path`
     is Ashby's, and it survives the emotion class names (`css-1wl1chj`) which
     are generated per build and mean nothing.
  3. Required is marked with `aria-required` on the control and an
     `aria-hidden` `<abbr>*</abbr>` inside the label span.
  4. `data-automation-id="beecatcher"` is a HONEYPOT. It is a visually hidden
     text input named "website" whose label reads "This input is for robots
     only, do not enter if you're human." Filling it marks the applicant as a
     bot. An autofill tool that writes into every text input it finds fails the
     application before a human ever reads it.
  5. The real submit button is `aria-hidden` with `tabindex="-2"`, sitting
     under an empty div with `role="button" aria-label="Submit"`
     (`data-automation-id="click_filter"`). Both must be refused.
-->
